name: Convert custom curated thumbnails

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
      - name: Recover thumbnails
        run: |
          set -euxo pipefail
          file static/curated-thumbnails/z-image-turbo.webp
          file static/curated-thumbnails/seedvr2-7b-upscale.webp
          dwebp static/curated-thumbnails/z-image-turbo.webp -o static/curated-thumbnails/z-image-turbo.png
          dwebp static/curated-thumbnails/seedvr2-7b-upscale.webp -o static/curated-thumbnails/seedvr2-7b-upscale.png
          test -s static/curated-thumbnails/z-image-turbo.png
          test -s static/curated-thumbnails/seedvr2-7b-upscale.png
          file static/curated-thumbnails/z-image-turbo.png | grep -q 'PNG image data'
          file static/curated-thumbnails/seedvr2-7b-upscale.png | grep -q 'PNG image data'
      - name: Update manifests and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          for manifest in (
              Path('workflow-packs/z-image-turbo/manifest.json'),
              Path('workflow-packs/seedvr2-7b-upscale/manifest.json'),
          ):
              text = manifest.read_text().replace('.webp"', '.png"')
              manifest.write_text(text)
          test = Path('tests/test_release_polish.py')
          text = test.read_text()
          text = text.replace('z-image-turbo.webp', 'z-image-turbo.png')
          text = text.replace('seedvr2-7b-upscale.webp', 'seedvr2-7b-upscale.png')
          text = text.replace("self.assertEqual(data[:4], b\"RIFF\")\n            self.assertEqual(data[8:12], b\"WEBP\")", "self.assertEqual(data[:8], b\"\\x89PNG\\r\\n\\x1a\\n\")")
          test.write_text(text)
          PY
          rm static/curated-thumbnails/z-image-turbo.webp static/curated-thumbnails/seedvr2-7b-upscale.webp
      - name: Commit recovered thumbnails
        run: |
          rm .github/workflows/convert-curated-thumbnails.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/curated-thumbnails workflow-packs tests/test_release_polish.py .github/workflows/convert-curated-thumbnails.yml
          git commit -m 'Fix custom curated thumbnails'
          git push
