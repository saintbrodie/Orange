name: Apply Curated Library polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch large files
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/patch_large_files.py
          python /tmp/patch_large_files.py
          python -m compileall -q app tests
          node --check static/workflow-pack-library.js
          node --check static/managed-comfyui.js
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/apply-curated-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Curated Library install controls'
          git push
