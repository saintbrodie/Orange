name: Apply Ollama generate patch

on:
  push:
    paths:
      - '.github/workflows/apply-ollama-generate.yml'
      - 'scripts/_apply_ollama_generate_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_apply_ollama_generate_patch.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate patch
        run: |
          python -m compileall -q app tests
          python -m unittest tests.test_llm -v
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/_apply_ollama_generate_patch.py .github/workflows/apply-ollama-generate.yml
          git add -A
          git commit -m 'Use Ollama generate API for prompt enhancement'
          git push
