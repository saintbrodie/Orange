name: Apply Admin Tools Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-admin-tools-cleanup.yml"
      - ".github/scripts/apply_admin_cleanup.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python .github/scripts/apply_admin_cleanup.py
      - name: Commit product and docs cleanup
        run: |
          git config user.name "Orange CI"
          git config user.email "actions@users.noreply.github.com"
          git add static/admin.html docs/WORKFLOW_PACKS.md README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh curated tools Admin docs"
            git push
          fi
      - name: Remove one-time migration files
        run: |
          git rm .github/scripts/apply_admin_cleanup.py .github/workflows/apply-admin-tools-cleanup.yml
          git commit -m "Remove one-time admin migration files"
          git push
