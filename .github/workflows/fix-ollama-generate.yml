name: Fix Ollama generate adapter

on:
  push:
    paths:
      - '.github/workflows/fix-ollama-generate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Ollama prompt routing and LLM resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          llm = Path('app/core/llm.py')
          text = llm.read_text(encoding='utf-8')
          old = '''        # Keep the UI provider list simple, but use Ollama's native chat API when
        # the configured OpenAI-compatible URL is clearly an Ollama server. The
        # native API lets Orange disable reasoning/thinking for this short task.
        if _is_ollama_endpoint(provider, base_url):
            url = _endpoint(_ollama_native_base(base_url), "http://127.0.0.1:11434", "api/chat")
            headers = {"Authorization": f"Bearer {resolved_key}"} if resolved_key else {}
            data = await _post_json(
                client,
                url,
                payload={
                    "model": model,
                    "messages": [
                        {"role": "system", "content": system_prompt},
                        {"role": "user", "content": prompt},
                    ],
                    "stream": False,
                    "think": False,
                    "options": {"num_predict": _max_tokens()},
                },
                headers=headers,
                resolved_key=resolved_key,
            )
            try:
                return _clean_output(data["message"]["content"])
            except (KeyError, TypeError):
                raise LLMError(
                    "Prompt enhancement service returned an invalid response.",
                    "Ollama response was missing message.content.",
                )
'''
          new = '''        # Keep the UI provider list simple, but use Ollama's native one-shot
        # generation API when the configured OpenAI-compatible URL is clearly
        # an Ollama server. Prompt enhancement is a transform, not a chat, and
        # /api/generate gives us direct system/prompt fields plus thinking control.
        if _is_ollama_endpoint(provider, base_url):
            url = _endpoint(_ollama_native_base(base_url), "http://127.0.0.1:11434", "api/generate")
            headers = {"Authorization": f"Bearer {resolved_key}"} if resolved_key else {}
            print(f"Prompt enhancement LLM route=ollama-generate model={model} url={url}")
            data = await _post_json(
                client,
                url,
                payload={
                    "model": model,
                    "system": system_prompt,
                    "prompt": prompt,
                    "stream": False,
                    "think": False,
                    "options": {"num_predict": _max_tokens()},
                },
                headers=headers,
                resolved_key=resolved_key,
            )
            try:
                return _clean_output(data["response"])
            except (KeyError, TypeError):
                raise LLMError(
                    "Prompt enhancement service returned an invalid response.",
                    "Ollama response was missing response text.",
                )
'''
          if old not in text:
              raise SystemExit('expected Ollama chat block not found')
          llm.write_text(text.replace(old, new), encoding='utf-8')

          api = Path('app/api/llm_api.py')
          text = api.read_text(encoding='utf-8')
          start = text.index('def _resolve_tool_llm(tool_id: str):')
          end = text.index('\n\n@router.post("/api/enhance-prompt")', start)
          replacement = '''def _resolve_tool_llm(tool_id: str):
    tool = get_tool_settings(tool_id)
    if not tool:
        raise HTTPException(status_code=400, detail="Invalid tool ID")

    mapping = tool.get("nodeMapping", {}) if isinstance(tool.get("nodeMapping"), dict) else {}
    if not mapping.get("prompt"):
        raise HTTPException(
            status_code=400,
            detail="Prompt enhancement is not supported for this tool.",
        )

    config = load_config()
    global_llm = config.get("llm", {}) if isinstance(config.get("llm"), dict) else {}
    tool_enhance = tool.get("promptEnhance", {}) if isinstance(tool.get("promptEnhance"), dict) else {}

    if not global_llm.get("enabled", False):
        raise HTTPException(status_code=400, detail="Prompt enhancement is disabled globally.")
    if tool_enhance.get("enabled", True) is False:
        raise HTTPException(status_code=400, detail="Prompt enhancement is disabled for this tool.")

    # Connection settings are global by design. Tool-level prompt enhancement
    # may override the model, but must not silently carry an old provider/base
    # URL/API key after the global provider changes.
    model = tool_enhance.get("model")
    if model in (None, ""):
        model = global_llm.get("model")

    return {
        "provider": global_llm.get("provider", "openai"),
        "base_url": global_llm.get("baseUrl"),
        "api_key": global_llm.get("apiKey"),
        "model": model,
        "system_prompt": get_system_prompt(tool_id),
    }
'''
          text = text[:start] + replacement + text[end:]
          marker = '    settings = _resolve_tool_llm(tool_id)\n    try:\n'
          insert = '''    settings = _resolve_tool_llm(tool_id)
    print(
        f"Prompt enhancement request tool={tool_id} provider={settings['provider']} "
        f"model={settings['model']} base_url={settings['base_url']}"
    )
    try:
'''
          if marker not in text:
              raise SystemExit('enhancement settings marker not found')
          api.write_text(text.replace(marker, insert, 1), encoding='utf-8')

          tests = Path('tests/test_llm.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'async def test_ollama_openai_url_uses_native_chat_without_thinking(self):',
              'async def test_ollama_openai_url_uses_native_generate_without_thinking(self):',
          )
          text = text.replace(
              'json_data={"message": {"content": "enhanced"}}',
              'json_data={"response": "enhanced"}',
              1,
          )
          text = text.replace(
              'self.assertEqual(url, "http://192.168.1.50:11434/api/chat")',
              'self.assertEqual(url, "http://192.168.1.50:11434/api/generate")',
          )
          text = text.replace(
              'self.assertFalse(kwargs["json"]["stream"])\n        self.assertFalse(kwargs["json"]["think"])\n        self.assertEqual(kwargs["json"]["options"]["num_predict"], 512)',
              'self.assertEqual(kwargs["json"]["system"], "system")\n        self.assertEqual(kwargs["json"]["prompt"], "prompt")\n        self.assertFalse(kwargs["json"]["stream"])\n        self.assertFalse(kwargs["json"]["think"])\n        self.assertEqual(kwargs["json"]["options"]["num_predict"], 512)',
              1,
          )
          tests.write_text(text, encoding='utf-8')

          Path('tests/test_llm_resolution.py').write_text('''import unittest\nfrom unittest.mock import patch\n\nfrom app.api.llm_api import _resolve_tool_llm\n\n\nclass LLMResolutionTests(unittest.TestCase):\n    @patch("app.api.llm_api.get_system_prompt", return_value="system")\n    @patch("app.api.llm_api.load_config")\n    @patch("app.api.llm_api.get_tool_settings")\n    def test_tool_cannot_override_global_connection(self, get_tool, load_config, _system):\n        get_tool.return_value = {\n            "id": "z-image",\n            "nodeMapping": {"prompt": {"nodeId": "1", "field": "text"}},\n            "promptEnhance": {\n                "enabled": True,\n                "provider": "anthropic",\n                "baseUrl": "https://stale.example",\n                "apiKey": "stale-secret",\n                "model": "tool-model",\n            },\n        }\n        load_config.return_value = {\n            "llm": {\n                "enabled": True,\n                "provider": "openai",\n                "baseUrl": "http://localhost:11434/v1",\n                "apiKey": "",\n                "model": "global-model",\n            }\n        }\n\n        resolved = _resolve_tool_llm("z-image")\n\n        self.assertEqual(resolved["provider"], "openai")\n        self.assertEqual(resolved["base_url"], "http://localhost:11434/v1")\n        self.assertEqual(resolved["api_key"], "")\n        self.assertEqual(resolved["model"], "tool-model")\n\n    @patch("app.api.llm_api.get_system_prompt", return_value="system")\n    @patch("app.api.llm_api.load_config")\n    @patch("app.api.llm_api.get_tool_settings")\n    def test_tool_without_model_uses_global_model(self, get_tool, load_config, _system):\n        get_tool.return_value = {\n            "id": "z-image",\n            "nodeMapping": {"prompt": {"nodeId": "1", "field": "text"}},\n            "promptEnhance": {"enabled": True},\n        }\n        load_config.return_value = {\n            "llm": {\n                "enabled": True,\n                "provider": "openai",\n                "baseUrl": "http://localhost:11434/v1",\n                "model": "global-model",\n            }\n        }\n\n        resolved = _resolve_tool_llm("z-image")\n        self.assertEqual(resolved["model"], "global-model")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate patch
        run: |
          python -m compileall -q app tests
          python -m unittest tests.test_llm tests.test_llm_resolution -v
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-ollama-generate.yml
          git add app/core/llm.py app/api/llm_api.py tests/test_llm.py tests/test_llm_resolution.py .github/workflows/fix-ollama-generate.yml
          git commit -m 'Use Ollama generate API for prompt enhancement'
          git push
