name: Harden Managed Local Gemma

on:
  push:
    branches: [main]
    paths:
      - 'scripts/harden_managed_gemma.py'
      - '.github/workflows/harden-managed-gemma.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/harden_managed_gemma.py
      - run: |
          python -m compileall -q app
          node --check static/managed-prompt-enhancer.js
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/harden_managed_gemma.py .github/workflows/harden-managed-gemma.yml
          git add -A
          git commit -m 'Harden managed Gemma runtime startup'
          git push
