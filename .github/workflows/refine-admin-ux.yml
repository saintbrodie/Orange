name: Refine Admin UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, *, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'Expected {count} matches in {path}, found {found}: {old[:100]!r}')
              text = text.replace(old, new)
              p.write_text(text)

          # Flatten Managed ComfyUI into the System Management section rather than
          # rendering a card inside the already-card-shaped General Settings page.
          replace(
              'static/managed-comfyui.js',
              "card.className = 'hidden mt-4 rounded-2xl border border-sky-900/50 bg-sky-950/10 p-4';",
              "card.className = 'hidden mt-5 border-t border-zinc-800/70 pt-5';",
              count=1,
          )

          # Cleaner provider chooser: Internal LLM, one OpenAI-compatible external
          # API path (including Ollama), and direct cloud APIs.
          replace(
              'static/admin.html',
              '''                                        <option value="managed">Managed Local — Gemma 4 E2B (Private)</option>\n                                        <option value="openai">OpenAI / Compatible (LM Studio, llama.cpp, OpenRouter)</option>\n                                        <option value="ollama">Ollama (Native)</option>\n                                        <option value="gemini">Google Gemini</option>\n                                        <option value="anthropic">Anthropic Claude</option>''',
              '''                                        <optgroup label="PRIVATE">\n                                            <option value="managed">Internal LLM — Gemma 4 E2B (Private)</option>\n                                        </optgroup>\n                                        <optgroup label="OPENAI-COMPATIBLE API">\n                                            <option value="openai">External API — OpenAI, Ollama, LM Studio, llama.cpp, OpenRouter</option>\n                                        </optgroup>\n                                        <optgroup label="DIRECT CLOUD API">\n                                            <option value="gemini">Google Gemini</option>\n                                            <option value="anthropic">Anthropic Claude</option>\n                                        </optgroup>''',
              count=1,
          )

          # Never allow the UI sentinel itself to become a model name in the
          # custom-model textbox.
          replace(
              'static/admin.js',
              '''        window.populateModelSelect = function(selectEl, customContainerId, customInputId, provider, activeValue, fetchedModels = []) {\n            if (!selectEl) return;\n            selectEl.innerHTML = '';''',
              '''        window.populateModelSelect = function(selectEl, customContainerId, customInputId, provider, activeValue, fetchedModels = []) {\n            if (!selectEl) return;\n            if (activeValue === '__custom__') activeValue = '';\n            selectEl.innerHTML = '';''',
          )

          # Legacy native-Ollama configs are represented by the unified
          # OpenAI-compatible provider in Admin. Saving migrates them permanently.
          replace(
              'static/admin.js',
              '''                    const llm = appConfig.llm || {};\n                    document.getElementById('setting-llm-enabled').checked = !!llm.enabled;\n                    document.getElementById('setting-llm-provider').value = llm.provider || 'openai';\n                    document.getElementById('setting-llm-baseurl').value = llm.baseUrl || '';\n                    document.getElementById('setting-llm-apikey').value = llm.apiKey || '';''',
              '''                    const llm = appConfig.llm || {};\n                    const legacyOllamaProvider = llm.provider === 'ollama';\n                    const llmUiProvider = legacyOllamaProvider ? 'openai' : (llm.provider || 'openai');\n                    let llmUiBaseUrl = llm.baseUrl || '';\n                    if (legacyOllamaProvider) {\n                        llmUiBaseUrl = (llmUiBaseUrl || 'http://127.0.0.1:11434').replace(/\\/+$/, '');\n                        if (!llmUiBaseUrl.endsWith('/v1')) llmUiBaseUrl += '/v1';\n                    }\n                    document.getElementById('setting-llm-enabled').checked = !!llm.enabled;\n                    document.getElementById('setting-llm-provider').value = llmUiProvider;\n                    document.getElementById('setting-llm-baseurl').value = llmUiBaseUrl;\n                    document.getElementById('setting-llm-apikey').value = llm.apiKey || '';''',
          )

          # A canceled job is historical information, not the current state of a
          # pack. Ignore it when choosing the job that drives a Curated card.
          replace(
              'static/workflow-pack-library.js',
              '''    (jobs || []).forEach((job) => {\n      const key = installKey(job.serverUrl, job.packId);''',
              '''    (jobs || []).forEach((job) => {\n      if (job?.state === 'canceled') return;\n      const key = installKey(job.serverUrl, job.packId);''',
              count=1,
          )
          replace(
              'static/workflow-pack-library.js',
              "    if (job?.state === 'canceled') return 'canceled';\n",
              '',
              count=1,
          )
          replace(
              'static/workflow-pack-library.js',
              "      canceled: ['Canceled', 'text-zinc-400 bg-zinc-800 border-zinc-700', 'circle-stop', false],\n",
              '',
              count=1,
          )
          replace(
              'static/workflow-pack-library.js',
              "    const retryable = job?.state === 'failed' || job?.state === 'interrupted' || job?.state === 'canceled';",
              "    const retryable = job?.state === 'failed' || job?.state === 'interrupted';",
              count=1,
          )
          replace(
              'static/workflow-pack-library.js',
              "      existingJob?.state === 'failed' || existingJob?.state === 'interrupted' || existingJob?.state === 'canceled'",
              "      existingJob?.state === 'failed' || existingJob?.state === 'interrupted'",
          )
          replace(
              'static/workflow-pack-library.js',
              "      const retry = existingJob?.state === 'failed' || existingJob?.state === 'interrupted' || existingJob?.state === 'canceled';",
              "      const retry = existingJob?.state === 'failed' || existingJob?.state === 'interrupted';",
              count=1,
          )

          # If cancellation completes immediately, remove the historical job from
          # the card and rescan now. Running cancellations are handled by polling.
          replace(
              'static/workflow-pack-library.js',
              '''      const job = data.job;\n      if (job) jobByKey.set(installKey(job.serverUrl, job.packId), job);\n      setLibraryStatus('Cancel requested. Orange will stop after the current network read finishes.', 'warning');\n      renderCatalog();\n      scheduleJobPoll();''',
              '''      const job = data.job;\n      if (job?.state === 'canceled') {\n        jobByKey.delete(installKey(job.serverUrl, job.packId));\n        setLibraryStatus('Setup canceled. The incomplete download was removed.', 'neutral');\n        await refreshCatalog({skipJobs: true});\n        return;\n      }\n      if (job) jobByKey.set(installKey(job.serverUrl, job.packId), job);\n      setLibraryStatus('Cancel requested. Orange will stop after the current network read finishes.', 'warning');\n      renderCatalog();\n      scheduleJobPoll();''',
              count=1,
          )

          # Cache bust all changed Admin assets.
          p = Path('static/admin.html')
          text = p.read_text()
          text = re.sub(r'/static/admin\\.js(?:\\?v=\\d+)?', '/static/admin.js?v=2', text)
          p.write_text(text)

          replace('app/main.py', '/static/workflow-pack-library.js?v=7', '/static/workflow-pack-library.js?v=8', count=1)
          replace('app/main.py', '/static/managed-comfyui.js?v=3', '/static/managed-comfyui.js?v=4', count=1)
          replace('app/main.py', '/static/managed-prompt-enhancer.js?v=2', '/static/managed-prompt-enhancer.js?v=3', count=1)

          # Expand JS syntax coverage for the Admin files touched by release polish.
          replace(
              '.github/workflows/ci.yml',
              '          node --check static/preflight.js\n',
              '          node --check static/admin.js\n          node --check static/managed-comfyui.js\n          node --check static/managed-prompt-enhancer.js\n          node --check static/preflight.js\n',
              count=1,
          )

          Path('tests/test_admin_release_polish.py').write_text('''import unittest\nfrom pathlib import Path\n\n\nclass AdminReleasePolishTests(unittest.TestCase):\n    def test_prompt_provider_ui_is_clean_and_ollama_uses_compatible_path(self):\n        root = Path(__file__).resolve().parents[1]\n        html = (root / "static" / "admin.html").read_text()\n        js = (root / "static" / "admin.js").read_text()\n        self.assertIn("Internal LLM — Gemma 4 E2B (Private)", html)\n        self.assertIn("External API — OpenAI, Ollama, LM Studio, llama.cpp, OpenRouter", html)\n        self.assertNotIn("Ollama (Native)", html)\n        self.assertIn("if (activeValue === '__custom__') activeValue = '';", js)\n        self.assertIn("const legacyOllamaProvider = llm.provider === 'ollama';", js)\n        self.assertIn("if (!llmUiBaseUrl.endsWith('/v1')) llmUiBaseUrl += '/v1';", js)\n\n    def test_managed_comfyui_is_flat_not_nested_card(self):\n        root = Path(__file__).resolve().parents[1]\n        js = (root / "static" / "managed-comfyui.js").read_text()\n        self.assertIn("hidden mt-5 border-t border-zinc-800/70 pt-5", js)\n        self.assertNotIn("hidden mt-4 rounded-2xl border border-sky-900/50", js)\n\n    def test_canceled_jobs_do_not_drive_curated_pack_cards(self):\n        root = Path(__file__).resolve().parents[1]\n        js = (root / "static" / "workflow-pack-library.js").read_text()\n        self.assertIn("if (job?.state === 'canceled') return;", js)\n        self.assertNotIn("if (job?.state === 'canceled') return 'canceled';", js)\n        self.assertIn("jobByKey.delete(installKey(job.serverUrl, job.packId));", js)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY
      - name: Validate patch
        run: |
          node --check static/admin.js
          node --check static/managed-comfyui.js
          node --check static/managed-prompt-enhancer.js
          node --check static/workflow-pack-library.js
          python -m unittest tests.test_admin_release_polish -v
      - name: Commit patch
        run: |
          rm .github/workflows/refine-admin-ux.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine prompt providers and canceled install UX'
          git push
