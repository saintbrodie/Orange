name: Refine Admin UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def rep(path, old, new, count=None):
              p=Path(path); t=p.read_text(); n=t.count(old)
              if n == 0 or (count is not None and n != count): raise SystemExit(f'{path}: expected {count or ">0"}, found {n}: {old[:80]!r}')
              p.write_text(t.replace(old,new))
          rep('static/managed-comfyui.js', "card.className = 'hidden mt-4 rounded-2xl border border-sky-900/50 bg-sky-950/10 p-4';", "card.className = 'hidden mt-5 border-t border-zinc-800/70 pt-5';", 1)
          rep('static/admin.html', '''                                        <option value="managed">Managed Local — Gemma 4 E2B (Private)</option>\n                                        <option value="openai">OpenAI / Compatible (LM Studio, llama.cpp, OpenRouter)</option>\n                                        <option value="ollama">Ollama (Native)</option>\n                                        <option value="gemini">Google Gemini</option>\n                                        <option value="anthropic">Anthropic Claude</option>''', '''                                        <optgroup label="PRIVATE">\n                                            <option value="managed">Internal LLM — Gemma 4 E2B (Private)</option>\n                                        </optgroup>\n                                        <optgroup label="OPENAI-COMPATIBLE API">\n                                            <option value="openai">External API — OpenAI, Ollama, LM Studio, llama.cpp, OpenRouter</option>\n                                        </optgroup>\n                                        <optgroup label="DIRECT CLOUD API">\n                                            <option value="gemini">Google Gemini</option>\n                                            <option value="anthropic">Anthropic Claude</option>\n                                        </optgroup>''', 1)
          rep('static/admin.js', '''        window.populateModelSelect = function(selectEl, customContainerId, customInputId, provider, activeValue, fetchedModels = []) {\n            if (!selectEl) return;\n            selectEl.innerHTML = '';''', '''        window.populateModelSelect = function(selectEl, customContainerId, customInputId, provider, activeValue, fetchedModels = []) {\n            if (!selectEl) return;\n            if (activeValue === '__custom__') activeValue = '';\n            selectEl.innerHTML = '';''')
          rep('static/admin.js', '''                    const llm = appConfig.llm || {};\n                    document.getElementById('setting-llm-enabled').checked = !!llm.enabled;\n                    document.getElementById('setting-llm-provider').value = llm.provider || 'openai';\n                    document.getElementById('setting-llm-baseurl').value = llm.baseUrl || '';\n                    document.getElementById('setting-llm-apikey').value = llm.apiKey || '';''', '''                    const llm = appConfig.llm || {};\n                    const legacyOllamaProvider = llm.provider === 'ollama';\n                    const llmUiProvider = legacyOllamaProvider ? 'openai' : (llm.provider || 'openai');\n                    let llmUiBaseUrl = llm.baseUrl || '';\n                    if (legacyOllamaProvider) {\n                        llmUiBaseUrl = (llmUiBaseUrl || 'http://127.0.0.1:11434').replace(/\\/+$/, '');\n                        if (!llmUiBaseUrl.endsWith('/v1')) llmUiBaseUrl += '/v1';\n                    }\n                    document.getElementById('setting-llm-enabled').checked = !!llm.enabled;\n                    document.getElementById('setting-llm-provider').value = llmUiProvider;\n                    document.getElementById('setting-llm-baseurl').value = llmUiBaseUrl;\n                    document.getElementById('setting-llm-apikey').value = llm.apiKey || '';''')
          rep('static/workflow-pack-library.js', '''    (jobs || []).forEach((job) => {\n      const key = installKey(job.serverUrl, job.packId);''', '''    (jobs || []).forEach((job) => {\n      if (job?.state === 'canceled') return;\n      const key = installKey(job.serverUrl, job.packId);''', 1)
          rep('static/workflow-pack-library.js', "    if (job?.state === 'canceled') return 'canceled';\n", '', 1)
          rep('static/workflow-pack-library.js', "      canceled: ['Canceled', 'text-zinc-400 bg-zinc-800 border-zinc-700', 'circle-stop', false],\n", '', 1)
          rep('static/workflow-pack-library.js', "    const retryable = job?.state === 'failed' || job?.state === 'interrupted' || job?.state === 'canceled';", "    const retryable = job?.state === 'failed' || job?.state === 'interrupted';", 1)
          rep('static/workflow-pack-library.js', "      existingJob?.state === 'failed' || existingJob?.state === 'interrupted' || existingJob?.state === 'canceled'", "      existingJob?.state === 'failed' || existingJob?.state === 'interrupted'")
          rep('static/workflow-pack-library.js', "      const retry = existingJob?.state === 'failed' || existingJob?.state === 'interrupted' || existingJob?.state === 'canceled';", "      const retry = existingJob?.state === 'failed' || existingJob?.state === 'interrupted';", 1)
          rep('static/workflow-pack-library.js', '''      const job = data.job;\n      if (job) jobByKey.set(installKey(job.serverUrl, job.packId), job);\n      setLibraryStatus('Cancel requested. Orange will stop after the current network read finishes.', 'warning');\n      renderCatalog();\n      scheduleJobPoll();''', '''      const job = data.job;\n      if (job?.state === 'canceled') {\n        jobByKey.delete(installKey(job.serverUrl, job.packId));\n        setLibraryStatus('Setup canceled. The incomplete download was removed.', 'neutral');\n        await refreshCatalog({skipJobs: true});\n        return;\n      }\n      if (job) jobByKey.set(installKey(job.serverUrl, job.packId), job);\n      setLibraryStatus('Cancel requested. Orange will stop after the current network read finishes.', 'warning');\n      renderCatalog();\n      scheduleJobPoll();''', 1)
          p=Path('static/admin.html'); t=p.read_text(); p.write_text(re.sub(r'/static/admin\.js(?:\?v=\d+)?','/static/admin.js?v=2',t))
          rep('app/main.py','/static/workflow-pack-library.js?v=7','/static/workflow-pack-library.js?v=8',1)
          rep('app/main.py','/static/managed-comfyui.js?v=3','/static/managed-comfyui.js?v=4',1)
          rep('app/main.py','/static/managed-prompt-enhancer.js?v=2','/static/managed-prompt-enhancer.js?v=3',1)
          Path('tests/test_admin_release_polish.py').write_text('''import unittest\nfrom pathlib import Path\nclass AdminReleasePolishTests(unittest.TestCase):\n def test_provider_ui(self):\n  r=Path(__file__).resolve().parents[1]; h=(r/'static/admin.html').read_text(); j=(r/'static/admin.js').read_text()\n  self.assertIn('External API — OpenAI, Ollama, LM Studio, llama.cpp, OpenRouter',h); self.assertNotIn('Ollama (Native)',h); self.assertIn("if (activeValue === '__custom__') activeValue = '';",j); self.assertIn("const legacyOllamaProvider = llm.provider === 'ollama';",j)\n def test_runtime_flat(self):\n  j=(Path(__file__).resolve().parents[1]/'static/managed-comfyui.js').read_text(); self.assertIn('hidden mt-5 border-t border-zinc-800/70 pt-5',j)\n def test_canceled_is_history_only(self):\n  j=(Path(__file__).resolve().parents[1]/'static/workflow-pack-library.js').read_text(); self.assertIn("if (job?.state === 'canceled') return;",j); self.assertNotIn("if (job?.state === 'canceled') return 'canceled';",j)\n''')
          PY
          node --check static/admin.js
          node --check static/managed-comfyui.js
          node --check static/workflow-pack-library.js
          python -m unittest tests.test_admin_release_polish -v
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/admin.html static/admin.js static/managed-comfyui.js static/workflow-pack-library.js app/main.py tests/test_admin_release_polish.py
          git commit -m 'Refine prompt providers and canceled install UX'
          git push
