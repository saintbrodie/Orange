name: Import Adventure background

on:
  push:
    branches:
      - chatgpt/personalization-themes
    paths:
      - ".github/workflows/adventure-import.yml"

permissions:
  contents: write

jobs:
  import-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/personalization-themes

      - name: Install exact uploaded SVG
        shell: bash
        run: |
          set -euo pipefail
          cat .adventure-import/topo.part{1..9} | base64 -d | gzip -d > /tmp/Topographic.svg
          echo "f1c601cd363486fb9c7dce6dbeee72ea62cbf155fc0fcc2a994e29bf7483fd42  /tmp/Topographic.svg" | sha256sum -c -
          test "$(wc -c < /tmp/Topographic.svg)" -eq 196311
          mv /tmp/Topographic.svg static/theme-assets/adventure-topo.svg
          rm -rf .adventure-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .adventure-import static/theme-assets/adventure-topo.svg
          git commit -m "Use supplied Adventure topo background"
          git push origin HEAD:chatgpt/personalization-themes
