name: Finalize Adventure background

on:
  push:
    branches:
      - chatgpt/personalization-themes
    paths:
      - ".github/workflows/adventure-import.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/personalization-themes

      - name: Use supplied SVG as one full-frame background and clean importer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path("static/theme-effects-v2.css")
          css = css_path.read_text(encoding="utf-8")
          css = css.replace(
              "/* ADVENTURE — supplied topo pattern recolored into Orange's outdoors palette,\n   with the dotted trail lines preserved as flat rust-orange accents. */",
              "/* ADVENTURE — supplied full-frame topo artwork, used as-is. */",
          )
          old = """/* True vector topo tile: path geometry only, no embedded raster image. */
          html[data-orange-effect=\"adventure\"] body::before {
            inset: 0 !important;
            opacity: .42 !important;
            animation: none !important;
            background-image: url('/static/theme-assets/adventure-topo.svg?v=2') !important;
            background-repeat: repeat !important;
            background-position: 0 0 !important;
            background-size: 520px 520px !important;
            transform: none !important;
          }"""
          new = """/* The supplied artwork is one full-frame SVG, not a repeatable tile. */
          html[data-orange-effect=\"adventure\"] body::before {
            inset: 0 !important;
            opacity: 1 !important;
            animation: none !important;
            background-image: url('/static/theme-assets/adventure-topo.svg?v=3') !important;
            background-repeat: no-repeat !important;
            background-position: center center !important;
            background-size: cover !important;
            transform: none !important;
          }"""
          if old not in css:
              raise SystemExit("Adventure background block not found")
          css_path.write_text(css.replace(old, new), encoding="utf-8")

          main_path = Path("app/main.py")
          main = main_path.read_text(encoding="utf-8")
          if 'theme-effects-v2.css?v=10' not in main:
              raise SystemExit("Unexpected theme-effects cache version")
          main_path.write_text(main.replace('theme-effects-v2.css?v=10', 'theme-effects-v2.css?v=11'), encoding="utf-8")
          PY

          rm .github/workflows/adventure-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/theme-effects-v2.css app/main.py .github/workflows/adventure-import.yml
          git commit -m "Finalize supplied Adventure background"
          git push origin HEAD:chatgpt/personalization-themes
