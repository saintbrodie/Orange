name: Apply Orange polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        shell: bash
        run: |
          printf '%s' '...TRUNCATED_FOR_BREVITY...' | base64 -d | gzip -d > /tmp/build_patch.py
          python /tmp/build_patch.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate patch
        shell: bash
        run: |
          python -m compileall -q app scripts tests
          node --check static/workflow-pack-library.js
          node --check static/managed-comfyui.js
          for manifest in workflow-packs/*/manifest.json; do python -m json.tool "$manifest" >/dev/null; done
          python -m unittest discover -s tests -v
      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-orange-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Polish managed runtime and workflow installs'
          git push