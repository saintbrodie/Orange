name: Prune old ChatGPT branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-chatgpt-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale feature branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'chatgpt/backend-state-routing',
              'chatgpt/config-validation',
              'chatgpt/first-run-workflow-packs',
              'chatgpt/generating-health-animation',
              'chatgpt/job-status-errors',
              'chatgpt/llm-hardening',
              'chatgpt/loadimage-source-preflight',
              'chatgpt/mobile-ux-backend-health',
              'chatgpt/mobile-ux-backend-health-v2',
              'chatgpt/orange-product-philosophy',
              'chatgpt/output-multioutput',
              'chatgpt/personalization-themes',
              'chatgpt/reliability-security-fixes',
              'chatgpt/result-ux-ratio-overrides',
              'chatgpt/sqlite-wal-backup',
              'chatgpt/submission-dto-hardening',
              'chatgpt/suppress-loadimage-placeholder-warning',
              'chatgpt/testing-feedback-fixes',
              'chatgpt/workflow-assets',
              'chatgpt/workflow-pack-library',
              'chatgpt/workflow-preflight'
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Skipped ${branch}: ${error.message}`);
                } else {
                  throw error;
                }
              }
            }
