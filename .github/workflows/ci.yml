name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
      - name: Check JavaScript syntax
        run: |
          node --check static/preflight.js
          node --check static/backend-status.js
          node --check static/tool-ratios.js
          node --check static/result-actions.js
          node --check static/workflow-assets.js
          node --check static/workflow-pack-library.js
          node --check static/mobile-navigation.js
          node --check static/theme-runtime.js
          node --check static/theme-effects.js
          node --check static/personalization.js
          node --check static/personalization-tab-state.js
          node --check static/setup.js
      - name: Validate first-run branding
        run: |
          grep -q '/static/orange-head.svg' static/setup.html
          if grep -q '🍊' static/setup.html; then
            echo 'First-run setup should use the Orange cat-head brand, not a literal orange emoji.'
            exit 1
          fi
      - name: Validate offline theme fonts
        run: |
          for font in \
            static/fonts/permanent-marker.woff2 \
            static/fonts/jersey-25.woff2 \
            static/fonts/sacramento.woff2 \
            static/fonts/fraunces-variable.woff2 \
            static/fonts/faculty-glyphic.woff2; do
            test -s "$font"
          done
          grep -q 'Orange Permanent Marker' static/brand-theme.css
          grep -q 'Orange Jersey 25' static/brand-theme.css
          grep -q 'Orange Sacramento' static/brand-theme.css
          grep -q 'Orange Fraunces' static/brand-theme.css
          grep -q 'Orange Faculty Glyphic' static/brand-theme.css
          grep -q 'preview.dataset.orangeEffect = selectedTheme' static/personalization.js
          if grep -Eq 'fonts\.(googleapis|gstatic)\.com' static/brand-theme.css; then
            echo 'Theme fonts must remain fully local/offline.'
            exit 1
          fi
      - name: Validate Admin tools library
        run: |
          grep -q '/static/workflow-pack-library.js' static/admin.html
          grep -q 'tools-subtab-curated' static/workflow-pack-library.js
          grep -q 'Curated Library' static/workflow-pack-library.js
          if grep -q 'restore-defaults-btn' static/admin.html; then
            echo 'Legacy Restore Default Workflows control should not be present in the Admin UI.'
            exit 1
          fi
      - name: Validate JSON manifests
        run: |
          python -m json.tool static/themes/presets.json >/dev/null
          for manifest in workflow-packs/*/manifest.json; do python -m json.tool "$manifest" >/dev/null; done
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
